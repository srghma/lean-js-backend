[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "LakeJs"
roots = ["LakeJs"]

[[lean_lib]]
name = "NonEmpty"
globs = ["NonEmpty.*"]

[[lean_lib]]
name = "SnapshotsPBOPure"
globs = ["SnapshotsPBOPure.*"]

[[lean_exe]]
name = "LakeJsTest"
root = "LakeJsTest.Main"
